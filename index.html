<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sistem Dokumen Otomatis</title>
<style>
:root{--bg:#fff;--card:#fff;--tx:#14213d;--mut:#6b7690;--nv:#14284b;--gr:#1f9d63;--bd:#dde3ee;--inp:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1626;--card:#16213a;--tx:#e8edf7;--mut:#93a0ba;--nv:#2a4a85;--gr:#34c185;--bd:#27355a;--inp:#0e1626;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
header{background:var(--nv);color:#fff;padding:14px 20px}
header h1{font-size:17px;margin:0}
main{max-width:980px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:12px}
button{background:var(--gr);color:#fff;border:0;border-radius:7px;padding:8px 14px;font:inherit;cursor:pointer}
button.sec{background:transparent;color:var(--tx);border:1px solid var(--bd)}
button.x{background:transparent;color:#d33;padding:4px 8px}
button:disabled{opacity:.4;cursor:not-allowed}
input,select,textarea{background:var(--inp);color:var(--tx);border:1px solid var(--bd);border-radius:6px;padding:7px 9px;font:inherit;width:100%}
textarea{min-height:64px}
label{font-size:12px;color:var(--mut);display:block;margin-bottom:3px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.tabs button{background:transparent;color:var(--tx);border:1px solid var(--bd)}
.tabs button.on{background:var(--nv);color:#fff;border-color:var(--nv)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.mut{color:var(--mut);font-size:13px}
.sc{overflow-x:auto}
.doc{background:#fff;color:#111;padding:30px;border:1px solid var(--bd);border-radius:6px;font-size:13px;font-family:Arial,Helvetica,sans-serif}
.doc h2{margin:0;color:#14284b;font-size:18px}
.doc table{width:100%;border-collapse:collapse;margin:10px 0}
.doc th{background:#14284b;color:#fff;text-align:left;padding:6px}
.doc td{padding:6px;border:1px solid #ccc;vertical-align:top}
.doc .n{text-align:right;white-space:nowrap}
.doc .loc td{background:#eef2f9;font-weight:700}
.doc .b td{font-weight:700}
.doc .nb td{border:0;padding:2px 4px}
.c{text-align:center}
.sg{display:block;height:56px;width:auto;margin:2px 0}
.sig .sg{margin:2px auto}
.logo{display:block;width:170px;max-width:100%;height:auto;margin:0 auto 10px}
.lh{text-align:center;border-bottom:2px solid #14284b;padding-bottom:10px;margin-bottom:14px;font-size:12px}
.nb .logo{margin:0 0 6px;width:150px}
.bn{background:#fff3cd;color:#664d03;padding:8px 20px;font-size:13px}
.bn:empty{display:none}
.tb{width:100%;border-collapse:collapse;min-width:560px}
.tb th,.tb td{padding:7px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:middle}
.tb th{font-size:12px;color:var(--mut)}
.tb .n{text-align:right;white-space:nowrap}
.bd{display:inline-block;padding:2px 9px;border-radius:12px;font-size:12px;font-weight:600}
.bd.ok{background:#d6f3e4;color:#0a6b3d}.bd.mid{background:#fff0c7;color:#7a5600}.bd.no{background:#fde0e0;color:#a12020}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:12px}
.sum .card{margin:0}.sum b{font-size:18px}
.wd td,.wd th{font-size:9px;padding:3px}
.doc.wd th{background:#7f7f7f;color:#fff}
.sig{display:flex;justify-content:space-between;margin-top:50px;text-align:center;gap:10px}
.sig div{flex:1}
@page{size:A4;margin:0}
.doc,.doc *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
@media print{*{-webkit-print-color-adjust:exact;print-color-adjust:exact}header,.tabs,.noprint,#bn{display:none!important}html,body{background:#fff!important;color:#111}:root{padding:0}main{padding:0;max-width:none;margin:0}.doc{border:0;border-radius:0;padding:14mm}.doc tr{break-inside:avoid}}

.doc.afs{font-family:Cambria,Caladea,"Times New Roman",serif;font-size:13px;color:#000}
.doc.afs .lh{border:0;padding:0;margin:0;text-align:center}
.doc.afs .afsh{display:block;width:calc(100% + 60px);max-width:none;height:auto;margin:-30px -30px 12px}
.doc.afs th{background:#C3BD96;color:#000;border:1px solid #000}
.doc.afs td{border:1px solid #000}
.doc.afs .sig{text-align:left}
.doc.afs .sig b{text-decoration:underline}
@media print{.doc.afs .afsh{width:calc(100% + 28mm);margin:-14mm -14mm 12px}}

.doc.afs .nb td{border:0}
.doc.ai{position:relative;overflow:hidden}
.doc.ai .wm{position:absolute;left:50%;top:50%;width:70%;height:auto;transform:translate(-50%,-50%);opacity:.07;pointer-events:none}
.doc.ai>*{position:relative}
.doc.ai>.wm{position:absolute}
.aih{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.aiz{width:190px;max-width:100%;height:auto;display:block}
.air{min-width:240px}
.ait{font-size:22px;font-weight:700;text-align:right;border-bottom:2px solid #948A54;margin-bottom:8px;padding-bottom:2px}
.aibar{border-top:3px solid #000;box-shadow:0 2px 3px rgba(0,0,0,.35);margin:10px 0 14px}
.doc.afs .ait2 th{background:#0D0D0D;color:#fff;border-color:#0D0D0D;text-align:center}
.doc.afs .ait2 td{padding:4px 6px}
.rp{float:left}
.doc.ai .aitot{width:42%;margin:14px 0 0 auto;border-collapse:collapse}
.doc.ai .aitot td{border:1px solid #000;padding:3px 6px}
.doc.ai .aitot tr.gt td{background:#948A54;color:#fff;font-weight:700}
.aihd{font-weight:700;color:#948A54;font-size:15px;margin:14px 0 4px}
.ail{margin:0;padding-left:22px}
.doc.afs .sig .sg{margin:2px 0;height:56px;width:auto}
</style>
</head>

function isT(p){return !!(VEND[p.vendor]&&VEND[p.vendor].kind==='termin')}
function uf(p,u){return (u.fee===undefined||u.fee==='')?(+p.fee||0):(+u.fee||0)}
function tot(p){return isT(p)?(p.units||[]).reduce(function(a,u){return a+uf(p,u)},0):sub(p.locs)}
function ensureT(p){if(isT(p)&&!p.units){p.units=[];p.fee=0;p.job='JASA INSTALASI INTERACTIVE FLAT PANEL (IFP)';p.pic=p.pic||'Up. Bagian Finance / Accounting';p.client=p.client||'PT. BAHTERA TITIK TIGA INDONESIA (BTTI)';p.tm=[{pct:50,no:'',dt:today(),due:today()},{pct:50,no:'',dt:today(),due:today()}]}}
function tb(n){var s=['','satu','dua','tiga','empat','lima','enam','tujuh','delapan','sembilan','sepuluh','sebelas'];
function f(n){n=Math.floor(n);if(n<12)return s[n];if(n<20)return f(n-10)+' belas';if(n<100)return f(Math.floor(n/10))+' puluh'+(n%10?' '+f(n%10):'');if(n<200)return 'seratus'+(n>100?' '+f(n-100):'');if(n<1e3)return f(Math.floor(n/100))+' ratus'+(n%100?' '+f(n%100):'');if(n<2e3)return 'seribu'+(n>1e3?' '+f(n-1e3):'');if(n<1e6)return f(Math.floor(n/1e3))+' ribu'+(n%1e3?' '+f(n%1e3):'');if(n<1e9)return f(Math.floor(n/1e6))+' juta'+(n%1e6?' '+f(n%1e6):'');return f(Math.floor(n/1e9))+' miliar'+(n%1e9?' '+f(n%1e9):'')}
var r=n?f(n):'nol';return r.charAt(0).toUpperCase()+r.slice(1)+' rupiah'}
function hk(x){x=String(x).toLowerCase();if(/id\s*transaksi/.test(x))return'id';if(/biaya|fee|tarif/.test(x))return'fee';if(/npsn/.test(x))return'npsn';if(/sekolah/.test(x))return'sch';if(/provinsi/.test(x))return'prov';if(/kab/.test(x))return'kab';if(/kecamatan/.test(x))return'kec';if(/serial/.test(x))return'sn';return''}
function impU(){var p=P(),c=0,map=null;document.getElementById('ut').value.split(/\r?\n/).forEach(function(l){var a=l.split(/\t|;/).map(function(x){return x.trim()});if(a.length<2)return;
if(a.some(function(x){return /^id\s*transaksi$/i.test(x)})){map={};a.forEach(function(x,i){var k=hk(x);if(k)map[k]=i});return}
var u={id:'',npsn:'',sch:'',prov:'',kab:'',kec:'',sn:'',fee:''};
if(map){for(var k in map)u[k]=a[map[k]]||''}else{if(a.length<7)return;if(/^\d+$/.test(a[0])&&a.length>=8)a.shift();u={id:a[0],npsn:a[1],sch:a[2],prov:a[3],kab:a[4],kec:a[5],sn:a[6],fee:''}}
if(!u.id&&!u.sch)return;if(u.fee)u.fee=String(u.fee).replace(/[^\d]/g,'');p.units.push(u);c++});
if(!c){banner('Tidak ada baris yang terbaca. Salin dari Excel beserta baris judulnya (ID Transaksi, Nama Sekolah, dst.), atau gunakan 7 kolom berurutan.');return}banner('Berhasil menambahkan '+c+' unit.');save();render()}

  +'<div class="sig"><div>Yang Menerima<br><br><br><br><b>( '+esc(p.recv)+' )</b><br>'+esc(p.recvRole)+'</div><div>Yang Menyerahkan'+sg()+'<b>('+CO.signer+')</b><br>PT.Langkah Kreasi Indonesia</div><div>Yang Mengetahui<br><br><br><br><b>('+esc(p.mgr)+')</b><br>'+esc(p.mgrRole)+'</div></div></div>'+pr();
}
function bastAfs(p){
  var h=dc()+'<div class="lh">'+lg()+'</div><h3 class="c">BERITA ACARA SERAH TERIMA</h3>'
  +'<p>Terima kasih atas kesempatan yang diberikan kepada <i>'+esc(CO.name)+'</i>. Pada hari ini tanggal '+dB(p.bastDate)+' kami telah menyelesaikan pekerjaan produksi display Lokasi <b><i>'+esc(p.projLoc)+'</i></b>, dalam keadaan baik.</p>'
  +'<table><tr><th>No</th><th colspan="2">Deskripsi</th><th colspan="2" class="c">Qty</th></tr>';
  var n=0;bLocs(p).forEach(function(l){l.items.forEach(function(i){n++;h+='<tr><td>'+n+'</td><td><b>'+esc(i.t)+'</b></td><td>'+esc(i.spec).replace(/\n/g,' ')+'</td><td class="c">'+i.q+'</td><td class="c">'+esc(i.u)+'</td></tr>'})});
  return h+'</table><p>Demikian Berita Acara ini di buat untuk dipergunakan sebagaimana mestinya.</p><div class="sig"><div>Yang Menerima<br><br><br><br><b>( '+esc(p.recv)+' )</b><br>'+esc(p.recvRole)+'</div><div>Yang Menyerahkan'+sg()+'<b>('+esc(CO.signer)+')</b><br><i>'+esc(CO.name)+'</i></div><div>Yang Mengetahui<br><br><br><br><b>('+esc(p.mgr)+')</b><br>'+esc(p.mgrRole)+'</div></div></div>'+pr();
}
function view(p){
  CO=VEND[p.vendor]||VEND.lki;var t=S.tab,h='';
  ensureT(p);
  if(t==='data')return isT(p)?tData(p):dataView();
  if(t==='pay')return payView(p);
  if(isT(p)&&(t==='t0'||t==='t1')){var ti=+t[1];return '<div class="card noprint"><div class="g">'+fld('No. Invoice','tm.'+ti+'.no')+fld('Tanggal','tm.'+ti+'.dt','date')+fld('Jatuh tempo','tm.'+ti+'.due','date')+'</div></div>'+tDoc(p,ti)}
  if(t==='dp')h='<div class="card noprint"><div class="g">'+fld('No. Invoice','dpNo')+fld('Tanggal','dpDate','date')+fld('DP (%)','dpPct','number',1)+'</div></div>'+dpDoc(p);
  if(t==='qt')h=qtDoc(p);
  if(t==='bast')h='<div class="card noprint"><div class="g">'+fld('Tanggal serah terima','bastDate','date')+fld('Yang menerima','recv')+fld('Jabatan','recvRole')+fld('Yang mengetahui','mgr')+fld('Jabatan','mgrRole')+'<div><label>Item BAST dari</label><select onchange="st(\'bastSrc\',this.value)"><option value="qt"'+(p.bastSrc==='ad'?'':' selected')+'>Quotation</option><option value="ad"'+(p.bastSrc==='ad'?' selected':'')+'>Addendum</option></select></div></div></div>'+(CO.bast==='afs'?bastAfs(p):bastDoc(p));
  if(t==='pl')h='<div class="card noprint"><div class="g">'+fld('No. Invoice','plNo')+fld('Tanggal','plDate','date')+'</div><p class="mut">Nominal = total pekerjaan dikurangi DP ('+p.dpPct+'%, ubah di tab Invoice DP).</p></div>'+plDoc(p);
  if(t==='ad')h='<div class="noprint"><div class="card"><div class="g">'+fld('No. Invoice Addendum','ad.no')+fld('Tanggal','ad.date','date')+fld('Billing address','ad.bill')+fld('Discount (Rp)','ad.disc','number',1)+'</div><p class="mut">Addendum terhubung ke project dan Quotation '+esc(p.qtNo)+'.</p></div>'+editor(1)+'</div>'+adDoc(p);
  return h;
}
function invs(p){var x=isT(p)?{d:0,b:0}:split(p),a=p.ad||{locs:[]},ad=sub(a.locs)-(+a.disc||0),r=[];
if(isT(p)){(p.tm||[]).forEach(function(t,i){if(p.done['t'+i])r.push({k:'t'+i,l:'Termin '+(i+1),no:t.no,dt:t.dt,due:Math.round(tot(p)*t.pct/100)})})}
if(!isT(p)&&p.done.dp)r.push({k:'dp',l:'Invoice DP',no:p.dpNo,dt:p.dpDate,due:x.d});
if(!isT(p)&&p.done.pl)r.push({k:'pl',l:'Invoice Pelunasan',no:p.plNo,dt:p.plDate,due:x.b});
if(!isT(p)&&p.done.ad&&ad>0)r.push({k:'ad',l:'Addendum',no:a.no,dt:a.date,due:ad});
r.forEach(function(i){i.paid=0;(p.pay||[]).forEach(function(y){if(y.inv===i.k)i.paid+=(+y.amt||0)});i.left=i.due-i.paid;i.st=i.paid>=i.due?'Lunas':(i.paid>0?'Sebagian':'Belum Dibayar')});return r}
function badge(s){return '<span class="bd '+(s==='Lunas'?'ok':s==='Sebagian'?'mid':'no')+'">'+s+'</span>'}
function prjSt(p){var r=invs(p);return r.length?(r.every(function(i){return i.st==='Lunas'})?'Lunas':'Berjalan'):'Draft'}
function addPay(){var p=P(),a=parseFloat(document.getElementById('pa').value)||0;if(a<=0)return;p.pay=p.pay||[];p.pay.push({id:'y'+Date.now(),inv:document.getElementById('pi').value,dt:document.getElementById('pd').value,amt:a,note:document.getElementById('pn').value});save();render()}
function delPay(id){var p=P();p.pay=p.pay.filter(function(y){return y.id!==id});save();render()}
function fillLeft(){var k=document.getElementById('pi').value,i=invs(P()).filter(function(x){return x.k===k})[0];if(i)document.getElementById('pa').value=Math.max(0,i.left)}
function openPay(id){S.cur=id;S.tab='pay';render()}
function payView(p){var r=invs(p),h='<div class="card"><b>Status Invoice</b><div class="sc"><table class="tb"><tr><th>Invoice</th><th>No.</th><th class="n">Tagihan</th><th class="n">Terbayar</th><th class="n">Sisa</th><th>Status</th></tr>';
if(!r.length)h+='<tr><td colspan="6" class="mut">Belum ada invoice. Buka tab Invoice DP terlebih dulu.</td></tr>';
r.forEach(function(i){h+='<tr><td>'+i.l+'</td><td>'+esc(i.no)+'</td><td class="n">'+rpI(i.due)+'</td><td class="n">'+rpI(i.paid)+'</td><td class="n">'+rpI(Math.max(0,i.left))+'</td><td>'+badge(i.st)+'</td></tr>'});
h+='</table></div></div>';
if(r.length){h+='<div class="card"><b>Catat pembayaran</b><div class="g" style="margin-top:8px"><div><label>Untuk invoice</label><select id="pi" onchange="fillLeft()">'+r.map(function(i){return '<option value="'+i.k+'">'+i.l+'</option>'}).join('')+'</select></div><div><label>Tanggal bayar</label><input id="pd" type="date" value="'+today()+'"></div><div><label>Nominal (Rp)</label><input id="pa" type="number" placeholder="0"></div><div><label>Catatan / metode</label><input id="pn" placeholder="Transfer BCA"></div></div><p><button onclick="addPay()">Simpan pembayaran</button> <button class="sec" onclick="fillLeft()">Isi sisa tagihan</button></p></div>'}
h+='<div class="card"><b>Riwayat pembayaran</b><div class="sc"><table class="tb"><tr><th>Tanggal</th><th>Invoice</th><th class="n">Nominal</th><th>Catatan</th><th></th></tr>';
var py=(p.pay||[]).slice().sort(function(a,b){return a.dt<b.dt?1:-1});
if(!py.length)h+='<tr><td colspan="5" class="mut">Belum ada pembayaran.</td></tr>';
py.forEach(function(y){var n={dp:'DP',pl:'Pelunasan',ad:'Addendum',t0:'Termin 1',t1:'Termin 2'}[y.inv];h+='<tr><td>'+dB(y.dt)+'</td><td>'+n+'</td><td class="n">'+rpI(y.amt)+'</td><td>'+esc(y.note)+'</td><td><button class="x" onclick="delPay(\''+y.id+'\')">Hapus</button></td></tr>'});
return h+'</table></div></div>';
}
function trkView(){var rows=[],tt=0,tp=0;S.d.projects.forEach(function(p){if(S.vf!=='all'&&(p.vendor||'lki')!==S.vf)return;invs(p).forEach(function(i){i.p=p;rows.push(i);tt+=i.due;tp+=i.paid})});
var f=rows.filter(function(i){return S.flt==='all'||i.st===S.flt}),nl=rows.filter(function(i){return i.st==='Lunas'}).length;
var h='<div class="sum"><div class="card"><div class="mut">Total tagihan</div><b>'+rpI(tt)+'</b></div><div class="card"><div class="mut">Terbayar</div><b>'+rpI(tp)+'</b></div><div class="card"><div class="mut">Sisa piutang</div><b>'+rpI(Math.max(0,tt-tp))+'</b></div><div class="card"><div class="mut">Invoice lunas</div><b>'+nl+' / '+rows.length+'</b></div></div>'
+'<div class="card"><div class="row" style="margin-bottom:8px"><b>Tracking Invoice</b><span><select style="width:auto" onchange="S.vf=this.value;render()"><option value="all">Semua vendor</option>'+Object.keys(VEND).map(function(k){return '<option value="'+k+'"'+(S.vf===k?' selected':'')+'>'+VEND[k].name+'</option>'}).join('')+'</select> <select style="width:auto" onchange="S.flt=this.value;render()">'+['all','Belum Dibayar','Sebagian','Lunas'].map(function(o){return '<option value="'+o+'"'+(S.flt===o?' selected':'')+'>'+(o==='all'?'Semua status':o)+'</option>'}).join('')+'</select></span></div><div class="sc"><table class="tb"><tr><th>Project</th><th>Invoice</th><th>No.</th><th class="n">Tagihan</th><th class="n">Terbayar</th><th class="n">Sisa</th><th>Status</th><th></th></tr>';
if(!f.length)h+='<tr><td colspan="8" class="mut">Tidak ada invoice.</td></tr>';
f.forEach(function(i){h+='<tr><td>'+esc(i.p.name)+' <span class="mut">'+(VEND[i.p.vendor]||VEND.lki).label+'</span></td><td>'+i.l+'</td><td>'+esc(i.no)+'</td><td class="n">'+rpI(i.due)+'</td><td class="n">'+rpI(i.paid)+'</td><td class="n">'+rpI(Math.max(0,i.left))+'</td><td>'+badge(i.st)+'</td><td><button class="sec" onclick="openPay(\''+i.p.id+'\')">Catat bayar</button></td></tr>'});
return h+'</table></div></div>';}
function listView(){
  var h='<div class="tabs"><button class="'+(S.lt==='prj'?'on':'')+'" onclick="S.lt=\'prj\';render()">Project</button><button class="'+(S.lt==='trk'?'on':'')+'" onclick="S.lt=\'trk\';render()">Tracking Pembayaran</button></div>';
  if(!S.loaded)return h+'<div class="card mut">Memuat data dari database...</div>';
  if(S.lt==='trk')return h+trkView();
  h+='<div class="row" style="margin-bottom:12px"><h2 style="margin:0">Daftar Project</h2><button onclick="newP()">+ Project Baru</button></div>';
  if(!S.d.projects.length)h+='<div class="card"><p class="mut">Belum ada project.</p><button class="sec" onclick="loadSample()">Muat project contoh (Soekarno Hatta)</button></div>';
  if(DB&&hasLocal())h+='<div class="card row"><span class="mut">Ada data lama di browser ini (LocalStorage).</span><button class="sec" onclick="importLocal()">Pindahkan ke database</button></div>';
  S.d.projects.forEach(function(p){h+='<div class="card row"><div><b>'+esc(p.name)+'</b> '+badge(prjSt(p)==='Lunas'?'Lunas':prjSt(p)==='Draft'?'Belum Dibayar':'Sebagian').replace(/>(Lunas|Belum Dibayar|Sebagian)</,'>'+prjSt(p)+'<')+'<div class="mut">'+(VEND[p.vendor]||VEND.lki).label+' · '+esc(p.client||'Klien belum diisi')+' · '+esc(p.qtNo)+' · '+rpI(tot(p))+'</div></div><div><button class="sec" onclick="openP(\''+p.id+'\')">Buka</button> <button class="x" onclick="delP(\''+p.id+'\')">Hapus</button></div></div>'});
  return h;
}
function render(){
  var a=document.getElementById('app'),p=P();
  if(!p){a.innerHTML=listView();return}
  var h='<div class="row noprint" style="margin-bottom:10px"><button class="sec" onclick="S.cur=null;render()">← Semua project</button><b>'+esc(p.name)+'</b></div><div class="tabs">';
  tabsFor(p).forEach(function(t){h+='<button class="'+(S.tab===t[0]?'on':'')+'" '+(ok(t[0])?'':'disabled title="Buat dokumen sebelumnya dulu"')+' onclick="tab(\''+t[0]+'\')">'+t[1]+'</button>'});
  a.innerHTML=h+'</div>'+view(p);
}
function mode(t){var m=document.getElementById('md');if(m)m.textContent=t}
function localInit(){try{var r=JSON.parse(localStorage.getItem(K)||'{}');S.d.projects=r.projects||[]}catch(e){}S.loaded=true;mode('Mode lokal (belum tersambung ke Google Sheets)');render()}
function loadAll(silent){if(silent&&(pend>0||dt))return Promise.resolve();return api({action:'list'}).then(function(j){S.d.projects=j.projects;S.loaded=true;if(S.cur&&!P())S.cur=null;banner('');var a=document.activeElement;if(silent&&a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)&&document.getElementById('app').contains(a))return;render()}).catch(function(e){if(e.message!=='unauthorized')banner('Tidak bisa terhubung ke Google Apps Script ('+e.message+'). Periksa URL /exec di index.html dan pastikan akses web app: Anyone.');if(!S.loaded){S.loaded=true;render()}})}
render();
if(/PASTE_URL/.test(API_URL)){localInit()}else{DB=true;mode('Google Sheets');if(!TOK){askTok()}else{loadAll();setInterval(function(){loadAll(true)},60000)}}
</script>
